<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranch Profile | Texas Ranch Meat</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><header id="siteHeader" class="ranch-header"></header><main class="container"><section class="card" style="max-width:560px;margin:0 auto"><h1>My Ranch Delivery Profile</h1><p style="color:var(--ink-muted);margin-bottom:1rem">Edit your saved Sunday delivery details.</p><form id="profileForm"><div class="form-group"><label for="phone">Mobile number (not yet verified)</label><input id="phone" disabled></div><div class="form-group"><label for="name">Full name</label><input id="name" required></div><div class="form-group"><label for="address">Delivery address</label><input id="address" required></div><div class="form-group"><label for="zip">Dallas-area ZIP code</label><input id="zip" maxlength="5" required></div><div style="display:flex;gap:.7rem;flex-wrap:wrap"><button id="saveProfile" type="submit" class="btn btn-sage">Save changes</button><button id="cancelEdit" type="button" class="btn btn-secondary">Cancel</button></div></form><p id="message" role="status" aria-live="polite" style="margin-top:1rem"></p></section></main><footer class="ranch-footer">Texas Ranch Meat • Grown & Served in Texas</footer>
<script type="module">
import {requireUser,getProfile,saveProfile,signOut} from "../js/supabase.js";
const $=id=>document.getElementById(id);let user,profile,snapshot;
const message=t=>$("message").textContent=t;
async function init(){user=await requireUser();if(!user){location.replace("/");return;}document.getElementById("siteHeader").innerHTML='<a href="/" class="brand-link"><img src="../assets/logo.jpg" alt="Texas Ranch Meat" class="brand-logo"><span>Texas Ranch Meat</span></a><nav class="ranch-nav"><a href="/">Storefront</a><a href="/orders/">My Orders</a><a href="/profile/" class="active">Ranch Profile</a><button id="signOut" class="btn btn-secondary btn-sm">Sign out</button></nav>';$("signOut").onclick=async()=>{await signOut();location.replace("/");};profile=await getProfile(user.id);if(!profile){location.replace("/");return;}snapshot={...profile};$("phone").value=profile.phone||"";$("name").value=profile.full_name||"";$("address").value=profile.address||"";$("zip").value=profile.zip||"";}
$("profileForm").onsubmit=async e=>{e.preventDefault();const b=$("saveProfile");b.disabled=true;try{const full_name=$("name").value.trim(),address=$("address").value.trim(),zip=$("zip").value.trim();if(!full_name||!address||!/^\\d{5}$/.test(zip))throw new Error("Enter your name, street address, and a five-digit ZIP code.");const updated=await saveProfile({id:user.id,phone:profile.phone,full_name,address,zip});profile=updated;snapshot={...updated};message("Profile saved successfully.");}catch(err){message(err.message);}finally{b.disabled=false;}};
$("cancelEdit").onclick=()=>{$("name").value=snapshot.full_name||"";$("address").value=snapshot.address||"";$("zip").value=snapshot.zip||"";message("Unsaved changes discarded.");};
init().catch(e=>message(e.message));
</script></body></html>
