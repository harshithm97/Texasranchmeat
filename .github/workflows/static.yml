name: Deploy static site to GitHub Pages

# Deploy the explicitly test-mode storefront after changes reach main.
# Real customer ordering remains disabled until Supabase auth, RLS, and admin
# authorization are implemented and reviewed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public site artifact
        run: |
          mkdir -p _site
          cp index.html admin.html orders.html profile.html _site/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          cp -R css js _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          # Never publish repository data, backups, or deployment notes.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
