name: Deploy static site to GitHub Pages

# Deliberately manual until the public ranch-state data is audited and the
# Supabase-backed authentication/order flow is ready for production.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public site artifact
        run: |
          mkdir -p _site
          cp index.html admin.html orders.html profile.html _site/
          cp -R css js _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          # Never publish repository data, backups, or deployment notes.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
