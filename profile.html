<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Ranch Profile | Texas Ranch Meat</title><link rel="stylesheet" href="css/styles.css" /></head>
<body><header id="siteHeader" class="ranch-header"></header><main class="container"><section class="card" style="max-width:560px;margin:0 auto"><h1>My Ranch Delivery Profile</h1><p style="color:var(--ink-muted);margin-bottom:1rem">Manage your account and saved Sunday delivery address.</p><form id="profileForm"><div class="form-group"><label for="phone">Mobile number (not yet verified)</label><input id="phone" disabled></div><div class="form-group"><label for="name">Full Name</label><input id="name" required></div><div class="form-group"><label for="address">Delivery Address</label><input id="address" required></div><div class="form-group"><label for="zip">Dallas-area ZIP Code</label><input id="zip" maxlength="5" required></div><button type="submit" class="btn btn-sage">Save profile</button></form><p id="message" role="status" style="margin-top:1rem"></p></section></main><footer class="ranch-footer">Texas Ranch Meat • Grown &amp; Served in Texas</footer>
<script type="module">
import {supabase,requireUser,getProfile,saveProfile,signOut} from "./js/supabase.js";
const user=await requireUser();if(!user)location.replace("index.html");else{document.getElementById("siteHeader").innerHTML=`<a href="index.html" class="brand-link"><img src="assets/logo.jpg" alt="Texas Ranch Meat" class="brand-logo"><span>Texas Ranch Meat</span></a><nav class="ranch-nav"><a href="index.html">Storefront</a><a href="orders.html">My Orders</a><a href="profile.html" class="active">Ranch Profile</a><button id="signOut" class="btn btn-secondary btn-sm">Sign out</button></nav>`;document.getElementById("signOut").onclick=async()=>{await signOut();location.href="index.html";};const p=await getProfile(user.id);document.getElementById("phone").value=p?.phone||user.user_metadata?.phone||"";document.getElementById("name").value=p?.full_name||"";document.getElementById("address").value=p?.address||"";document.getElementById("zip").value=p?.zip||"";document.getElementById("profileForm").onsubmit=async e=>{e.preventDefault();const zip=document.getElementById("zip").value.trim();if(!/^7[5-6]\d{3}$/.test(zip)){document.getElementById("message").textContent="Enter a valid Dallas-area Texas ZIP code.";return;}try{await saveProfile({id:user.id,phone:p?.phone||user.user_metadata?.phone,full_name:document.getElementById("name").value.trim(),address:document.getElementById("address").value.trim(),zip});document.getElementById("message").textContent="Profile saved successfully.";}catch(err){document.getElementById("message").textContent=err.message;}};}
</script></body></html>
