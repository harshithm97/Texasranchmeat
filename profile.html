<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranch Profile | Texas Ranch Meat</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="siteHeader" class="ranch-header"></header>

  <main class="container">
    <section class="card" style="max-width:560px; margin:0 auto;">
      <h1>My Ranch Delivery Profile</h1>
      <p style="color:var(--ink-muted); margin-bottom:1rem;">Saved for fast weekend ordering across the Dallas 30-mile delivery area.</p>
      <form id="profileForm">
        <div class="form-group">
          <label for="profPhone">Phone Number (Account ID)</label>
          <input type="text" id="profPhone" disabled />
        </div>
        <div class="form-group">
          <label for="profName">Full Name</label>
          <input type="text" id="profName" required />
        </div>
        <div class="form-group">
          <label for="profAddress">Delivery Address</label>
          <input type="text" id="profAddress" required />
        </div>
        <div class="form-group">
          <label for="profZip">Dallas-Area ZIP Code (75001–76299)</label>
          <input type="text" id="profZip" maxlength="5" inputmode="numeric" required />
        </div>
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
          <button type="submit" class="btn btn-sage">Save Changes</button>
          <button type="button" id="signOutBtn" class="btn btn-secondary">Switch Phone Number</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="ranch-footer">
    Texas Ranch Meat • Grown &amp; Served in Texas
  </footer>

  <script type="module">
    import {
      loadState, saveState, getSessionPhone, setSessionPhone,
      formatPhone, isDallas30MileZip, renderHeader, showToast
    } from "./js/store.js";

    const phone = getSessionPhone();
    if (!phone) {
      window.location.replace("index.html");
    } else {
      renderHeader("profile");
      const state = loadState();
      const customer = state.customers[phone] || { phone, fullName: "", address: "", zip: "" };

      document.getElementById("profPhone").value = formatPhone(phone);
      document.getElementById("profName").value = customer.fullName || "";
      document.getElementById("profAddress").value = customer.address || "";
      document.getElementById("profZip").value = customer.zip || "";

      document.getElementById("profileForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const zip = document.getElementById("profZip").value.trim();
        if (!isDallas30MileZip(zip)) {
          showToast("Address must be within the 30-mile Dallas radius (ZIP 75001–76299).");
          return;
        }
        state.customers[phone] = {
          ...customer,
          phone,
          fullName: document.getElementById("profName").value.trim(),
          address: document.getElementById("profAddress").value.trim(),
          zip
        };
        saveState(state);
        showToast("Profile updated!");
      });

      document.getElementById("signOutBtn").addEventListener("click", () => {
        setSessionPhone("");
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
